services:
  node:
    image: node:24-alpine
    working_dir: /var/www
    volumes:
      - ./:/var/www
    profiles:
      - node
    ports:
      - '5173:5173'
    networks:
      - reviews

  app:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    container_name: reviews_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
      - redis
    networks:
      - reviews

  nginx:
    image: nginx:alpine
    container_name: reviews_nginx
    ports:
      - '${NGINX_EXT_PORT:-8000}:80'
    volumes:
      - ./:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - reviews

  mysql:
    image: mysql:8.0
    container_name: reviews_mysql
    ports:
      - '${MYSQL_EXT_PORT:-3306}:3306'
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-reviews}
      MYSQL_USER: ${DB_DATABASE:-reviews}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    volumes:
      - reviews_mysql_data:/var/lib/mysql
    networks:
      - reviews

  redis:
    image: redis:alpine
    container_name: reviews_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-secret} --appendonly yes
    ports:
      - '${REDIS_EXT_PORT:-6379}:6379'
    volumes:
      - reviews_redis_data:/data
    networks:
      - reviews

  selenium:
    image: selenium/standalone-chrome:latest
    container_name: reviews_selenium_chrome
    expose:
      - "4444"
    shm_size: 2gb
    networks:
      - reviews

networks:
  reviews:

volumes:
  reviews_mysql_data:
  reviews_redis_data:
